# READ-ONLY check of the Supabase project: which tables exist and how many
# rows / users. Changes nothing. Use it before setup-backend on a project that
# might already be used by another app.
name: db-info

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Tables and users (read only)
        run: |
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL") || { echo "::error::SUPABASE_URL secret missing/invalid"; exit 1; }
          export PROJECT_REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          .github/scripts/sql.sh "select coalesce(string_agg(c.relname || ' (' || c.reltuples::bigint || ')', ', ' order by c.relname), 'none') as tables
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r'" > /tmp/t.json
          .github/scripts/sql.sh "select count(*) as users from auth.users" > /tmp/u.json
          .github/scripts/sql.sh "select coalesce(string_agg(id, ', '), 'none') as buckets from storage.buckets" > /tmp/b.json
          .github/scripts/sql.sh "select coalesce((select string_agg(c.relname || ' (' || c.reltuples::bigint || ')', ', ') from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'app_private'), 'no app_private schema') as t,
            (select count(*) from information_schema.tables where table_schema = 'app_private') as n" > /tmp/a.json
          echo "::notice title=app_private schema::$(jq -r '.[0].t' /tmp/a.json)"
          echo "::notice title=Project ${PROJECT_REF} — public tables (approx rows)::$(jq -r '.[0].tables' /tmp/t.json | cut -c1-900)"
          echo "::notice title=Login users::$(jq -r '.[0].users' /tmp/u.json)"
          echo "::notice title=Storage buckets::$(jq -r '.[0].buckets' /tmp/b.json)"
