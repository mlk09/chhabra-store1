# READ-ONLY check of the Supabase project: which tables exist and how many
# rows / users. Changes nothing. Use it before setup-backend on a project that
# might already be used by another app.
name: db-info

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Tables and users (read only)
        run: |
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL") || { echo "::error::SUPABASE_URL secret missing/invalid"; exit 1; }
          export PROJECT_REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          OUTFILE=/tmp/t.json .github/scripts/sql.sh "select coalesce(string_agg(c.relname || ' (' || c.reltuples::bigint || ')', ', ' order by c.relname), 'none') as tables
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r'"
          OUTFILE=/tmp/u.json .github/scripts/sql.sh "select count(*) as users from auth.users"
          OUTFILE=/tmp/b.json .github/scripts/sql.sh "select coalesce(string_agg(id, ', '), 'none') as buckets from storage.buckets"
          OUTFILE=/tmp/a.json .github/scripts/sql.sh "select coalesce((select string_agg(c.relname || ' (' || c.reltuples::bigint || ')', ', ') from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'app_private'), 'no app_private schema') as t,
            (select count(*) from information_schema.tables where table_schema = 'app_private') as n"
          OUTFILE=/tmp/ai.json .github/scripts/sql.sh "select coalesce(string_agg(u.email || ' day=' || a.day || ' count=' || a.count, '; '), 'no AI requests reached the server yet') as rows from public.ai_usage a join auth.users u on u.id = a.user_id" || true
          [ -f /tmp/ai.json ] && echo "::notice title=AI requests that reached the server::$(jq -r '.[0].rows' /tmp/ai.json)"
          OUTFILE=/tmp/own.json .github/scripts/sql.sh "select coalesce(string_agg(u.email || ' (' || m.role || ')', ', '), 'none') as o from public.shop_members m join auth.users u on u.id = m.user_id" || true
          [ -f /tmp/own.json ] && echo "::notice title=Shop owners/staff::$(jq -r '.[0].o' /tmp/own.json)"
          OUTFILE=/tmp/log.json .github/scripts/sql.sh "select at, model, status, ms, bytes, note from public.ai_log order by at desc limit 15" || true
          [ -f /tmp/log.json ] && jq -r '.[] | "\(.at) | \(.model) | HTTP \(.status) | \(.ms) ms | \(.bytes) b64 bytes | \(.note // "")"' /tmp/log.json | while IFS= read -r l; do echo "::notice title=AI try::${l:0:280}"; done
          echo "::notice title=app_private schema::$(jq -r '.[0].t' /tmp/a.json)"
          echo "::notice title=Project ${PROJECT_REF} — public tables (approx rows)::$(jq -r '.[0].tables' /tmp/t.json | cut -c1-900)"
          echo "::notice title=Login users::$(jq -r '.[0].users' /tmp/u.json)"
          echo "::notice title=Storage buckets::$(jq -r '.[0].buckets' /tmp/b.json)"
