# One click: prepares your Supabase project and rebuilds the app against it.
#   • applies database migrations (tables + security rules) — only new ones
#   • creates your shop row + starter categories
#   • login settings: email sign-up without confirmation mail, reset-link URLs
#   • deploys Edge Functions (from Phase 3) and their secrets
# Safe to run again any time (e.g. after an app update adds a migration).
#
# Needs repository secrets (README → "Secrets"):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_ACCESS_TOKEN
# Optional: GEMINI_API_KEY (free, aistudio.google.com/apikey) → photo recognition.
name: setup-backend

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to start the "build" workflow afterwards

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          [ -z "$RAW_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$missing" ] && { echo "::error::Missing repository secrets:$missing"; exit 1; }
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL") || { echo "::error::SUPABASE_URL is not a Supabase project URL (https://<ref>.supabase.co)"; exit 1; }
          echo "PROJECT_REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')" >> "$GITHUB_ENV"

      - name: Apply database migrations (only ones not applied yet)
        run: |
          .github/scripts/sql.sh "create schema if not exists app_private;
            create table if not exists app_private.migrations (name text primary key, applied_at timestamptz not null default now());
            revoke all on schema app_private from public, anon, authenticated;" >/dev/null
          APPLIED=$(.github/scripts/sql.sh "select coalesce(json_agg(name), '[]') as names from app_private.migrations" | jq -r '.[0].names[]?')
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            if echo "$APPLIED" | grep -qx "$name"; then echo "✓ $name (already applied)"; continue; fi
            echo "▶ applying $name"
            # Migration + its record run as ONE request → all or nothing.
            { cat "$f"; printf "\ninsert into app_private.migrations (name) values ('%s');\n" "$name"; } > /tmp/m.sql
            .github/scripts/sql.sh -f /tmp/m.sql >/dev/null
            echo "::notice title=Migration applied::$name"
          done

      - name: Shop + starter categories
        run: |
          .github/scripts/sql.sh -f supabase/seed/seed.sql >/dev/null
          .github/scripts/sql.sh "select name, city from public.shops"

      - name: Login settings (no confirmation email, reset links open the web app)
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          SITE="https://${OWNER,,}.github.io/${REPO}/app/"
          BODY=$(jq -n --arg site "$SITE" '{mailer_autoconfirm: true, site_url: $site, uri_allow_list: ($site + "**"), password_min_length: 6}')
          CODE=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          if [ "$CODE" = "200" ]; then
            echo "::notice title=Login settings::Email confirmation OFF, site URL $SITE"
          else
            echo "::warning title=Set login settings by hand (HTTP $CODE)::Supabase → Authentication → Sign In / Providers → Email → turn OFF 'Confirm email'. Then URL Configuration → Site URL = $SITE"
          fi

      - uses: supabase/setup-cli@v1
        if: hashFiles('supabase/functions/*/index.ts') != ''
        with: { version: latest }
      - name: Store server-side secrets (never in the app)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=Photo recognition off::Add repository secret GEMINI_API_KEY (free key from https://aistudio.google.com/apikey) and run setup-backend again."
            exit 0
          fi
          supabase secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY" AI_DAILY_LIMIT=300 >/dev/null
          echo "::notice title=Photo recognition on::GEMINI_API_KEY saved in Supabase Secrets."

      - name: Deploy Edge Functions
        if: hashFiles('supabase/functions/*/index.ts') != ''
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir"); [ "$fn" = "_shared" ] && continue
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - name: Rebuild the app with Supabase connected
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref main
