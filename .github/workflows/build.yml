# Every push to main: analyze → Dart tests → database/RLS tests → Android APK
# (downloadable artifact) → web app + download page on GitHub Pages.
# Published, permanently-signed releases come from the "release" workflow.
#
# Repo → Settings → Pages → Source: "GitHub Actions".
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Database + RLS tests
        env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
        run: tools/test_db.sh

  android:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Write .env from secrets
        env: { RAW_URL: "${{ secrets.SUPABASE_URL }}", RAW_KEY: "${{ secrets.SUPABASE_ANON_KEY }}" }
        run: .github/scripts/write_env.sh
      - name: Permanent signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          echo "$KS" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$ALIAS" "$PW" "$PW" > android/key.properties
      - if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning title=Test signing::No signing key yet — this test APK uses a temporary key. Run the 'create-signing-key' workflow once (README → Signing key)."
      - run: .github/scripts/flutter_build.sh build apk --release --split-per-abi --dart-define-from-file=.env
      - run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk chhabra-store-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: chhabra-store-test-apk, path: chhabra-store-test.apk, retention-days: 14 }

  web:
    needs: test
    # Pages only deploys from the default branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Write .env from secrets
        env: { RAW_URL: "${{ secrets.SUPABASE_URL }}", RAW_KEY: "${{ secrets.SUPABASE_ANON_KEY }}" }
        run: .github/scripts/write_env.sh
      - name: Point the download page at the latest release (only if one exists)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          REL=$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null || echo '{}')
          TAG=$(echo "$REL" | jq -r '.tag_name // empty')
          has() { echo "$REL" | jq -e --arg n "$1" '[.assets[]?.name] | index($n)' >/dev/null; }
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          if [ -n "$TAG" ] && has chhabra-store.apk; then
            sed -i "s|apk: \"\"|apk: \"$BASE/chhabra-store.apk\"|; s|version: \"\"|version: \"${TAG#v}\"|" web_download/config.js
            has chhabra-store-old-phones.apk && sed -i "s|apkOld: \"\"|apkOld: \"$BASE/chhabra-store-old-phones.apk\"|" web_download/config.js
            echo "::notice title=Download page::Android button → release $TAG"
          else
            echo "No release yet — the Android button says 'coming soon'."
          fi
      - name: Build web app (lives at /<repo>/app/)
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/app/" --dart-define-from-file=.env
      - name: QR code for the download page
        run: |
          pip install --quiet "qrcode[pil]==8.2"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          python3 tools/make_qr.py "https://${OWNER,,}.github.io/${{ github.event.repository.name }}/" web_download/qr.png
      - name: Assemble site
        run: |
          mkdir -p deploy/app
          cp -r build/web/. deploy/app/
          cp web_download/* deploy/
          cp assets/icon/app_icon.png deploy/icon.png
          touch deploy/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: deploy }
      - id: deploy
        uses: actions/deploy-pages@v4
