# Monthly service control for the shop.
#   pause  → the app stays visible, but new online orders stop and the
#            shopkeeper sees "paused by your app provider" (e.g. fees due).
#   resume → orders work again. You can also record "paid until" date.
# Actions → shop-service → Run workflow.
name: shop-service

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pause or resume"
        type: choice
        options: [resume, pause]
        default: resume
      note:
        description: "Message shown to the shopkeeper when paused (optional)"
        required: false
      paid_until:
        description: "Paid until (YYYY-MM-DD, optional, for your records)"
        required: false

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      ACTION: ${{ inputs.action }}
      NOTE: ${{ inputs.note }}
      PAID: ${{ inputs.paid_until }}
    steps:
      - uses: actions/checkout@v5
      - name: Update the shop
        run: |
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL") || { echo "::error::SUPABASE_URL secret missing/invalid"; exit 1; }
          export PROJECT_REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          [ -z "$PAID" ] || [[ "$PAID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::paid_until must look like 2026-12-31"; exit 1; }
          STATUS=$([ "$ACTION" = "pause" ] && echo paused || echo active)
          # Note travels as JSON so quotes in it can't break the SQL.
          ARGS=$(jq -cn --arg s "$STATUS" --arg n "${NOTE:0:200}" --arg p "$PAID" '{s:$s, n:$n, p:$p}')
          .github/scripts/sql.sh "with a as (select '$(printf '%s' "$ARGS" | sed "s/'/''/g")'::jsonb as j)
            update public.shops set service_status = a.j->>'s',
                                    service_note = nullif(a.j->>'n', ''),
                                    paid_until = coalesce(nullif(a.j->>'p', '')::date, paid_until)
            from a where slug = 'chhabra-general-store'
            returning name, service_status, paid_until" | jq -c .
          echo "::notice title=Shop is now $STATUS::${NOTE}"
