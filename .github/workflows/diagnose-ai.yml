# Checks the photo-recognition chain and reports timings/errors as annotations
# (no secrets shown): Gemini models directly, then a real photo through product-ai.
name: diagnose-ai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      ANON: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Test photo
        run: |
          pip install --quiet pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGB", (900, 900), (250, 250, 245))
          d = ImageDraw.Draw(img)
          f = ImageFont.truetype("assets/fonts/Mukta-Bold.ttf", 110)
          s = ImageFont.truetype("assets/fonts/Mukta-SemiBold.ttf", 60)
          d.rectangle([80, 80, 820, 820], outline=(0, 70, 160), width=12)
          d.text((150, 200), "TATA SALT", font=f, fill=(0, 70, 160))
          d.text((150, 420), "Net Wt. 1 kg", font=s, fill=(20, 20, 20))
          d.text((150, 520), "MRP Rs. 30.00", font=s, fill=(20, 20, 20))
          img.save("/tmp/test.jpg", quality=80)
          PY
          base64 -w0 /tmp/test.jpg > /tmp/test.b64
          echo "image bytes: $(stat -c%s /tmp/test.jpg)"
      - name: 1 · Gemini models directly (time + answer)
        run: |
          [ -z "$GEMINI_API_KEY" ] && { echo "::error::GEMINI_API_KEY secret missing"; exit 0; }
          for model in gemini-flash-latest gemini-flash-lite-latest gemini-2.5-flash gemini-2.5-flash-lite; do
            for think in default off; do
              if [ "$think" = off ]; then TC=',"thinkingConfig":{"thinkingBudget":0}'; else TC=''; fi
              jq -n --rawfile img /tmp/test.b64 --arg tc "$TC" '{contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:($img|rtrimstr("\n"))}},{text:"Identify the product. Reply JSON {\"name\":string,\"size\":string,\"mrp\":number}."}]}],generationConfig:{temperature:0.1,responseMimeType:"application/json"}}' > /tmp/body.json
              [ -n "$TC" ] && jq '.generationConfig.thinkingConfig={"thinkingBudget":0}' /tmp/body.json > /tmp/b2 && mv /tmp/b2 /tmp/body.json
              START=$(date +%s.%N)
              CODE=$(curl -s -m 90 -o /tmp/r.json -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
                -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" --data-binary @/tmp/body.json || echo 000)
              SECS=$(python3 -c "import time;print(round(time.time()-$START,1))")
              if [ "$CODE" = "200" ]; then
                echo "::notice title=$model thinking=$think → ${SECS}s::$(jq -r '.candidates[0].content.parts[0].text' /tmp/r.json | tr '\n' ' ' | cut -c1-160) · model=$(jq -r '.modelVersion // "?"' /tmp/r.json)"
              else
                echo "::warning title=$model thinking=$think → HTTP $CODE in ${SECS}s::$(jq -c '.error.message // .' /tmp/r.json 2>/dev/null | cut -c1-200)"
              fi
            done
          done
      - name: 2 · product-ai function reachable
        run: |
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL")
          for m in OPTIONS POST; do
            START=$(date +%s.%N)
            CODE=$(curl -s -m 60 -o /tmp/f.json -w '%{http_code}' -X $m "$URL/functions/v1/product-ai" -H "Origin: https://mlk09.github.io" -H "apikey: $ANON" -H "Content-Type: application/json" -d '{}' || echo 000)
            SECS=$(python3 -c "import time;print(round(time.time()-$START,1))")
            echo "::notice title=product-ai $m → HTTP $CODE in ${SECS}s::$(head -c 200 /tmp/f.json) (POST without login should be 401)"
          done
      - name: 3 · Real photo through product-ai (temporary owner, removed afterwards)
        run: |
          URL=$(.github/scripts/normalize_supabase_url.sh "$RAW_URL")
          export PROJECT_REF=$(echo "$URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          EMAIL="diag-$(date +%s)-$RANDOM@example.com"; PASS="Diag-$RANDOM-$RANDOM-x"
          curl -s -o /tmp/s.json "$URL/auth/v1/signup" -H "apikey: $ANON" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}"
          TOKEN=$(jq -r '.access_token // empty' /tmp/s.json)
          [ -z "$TOKEN" ] && { echo "::error title=Test sign-up failed::$(jq -c . /tmp/s.json | cut -c1-200)"; exit 0; }
          QUIET=1 .github/scripts/sql.sh "insert into public.shop_members (shop_id, user_id, role) select s.id, u.id, 'owner' from public.shops s, auth.users u where s.slug = 'chhabra-general-store' and u.email = '$EMAIL'"
          OUTFILE=/tmp/shop.json .github/scripts/sql.sh "select id from public.shops where slug = 'chhabra-general-store'"
          SHOP=$(jq -r '.[0].id' /tmp/shop.json)
          jq -n --rawfile img /tmp/test.b64 --arg shop "$SHOP" '{shop_id:$shop, image_base64:($img|rtrimstr("\n")), categories:[{id:"none-test",name:"Sugar, Salt & Jaggery"}]}' > /tmp/req.json
          START=$(date +%s.%N)
          CODE=$(curl -s -m 70 -o /tmp/ai.json -w '%{http_code}' -X POST "$URL/functions/v1/product-ai" -H "Authorization: Bearer $TOKEN" -H "apikey: $ANON" -H "Content-Type: application/json" --data-binary @/tmp/req.json || echo 000)
          SECS=$(python3 -c "import time;print(round(time.time()-$START,1))")
          if [ "$CODE" = "200" ]; then
            echo "::notice title=✅ product-ai answered in ${SECS}s::$(jq -c '.guess | {name, size_label, mrp, confidence}' /tmp/ai.json)"
          else
            echo "::error title=product-ai HTTP $CODE in ${SECS}s::$(head -c 300 /tmp/ai.json)"
          fi
          # Photo upload exactly like the app (owner, new file name, no upsert).
          OBJ="$SHOP/diag-test/$(date +%s).jpg"
          CODE=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST "$URL/storage/v1/object/product-images/$OBJ" \
            -H "Authorization: Bearer $TOKEN" -H "apikey: $ANON" -H "Content-Type: image/jpeg" -H "Cache-Control: max-age=31536000" \
            --data-binary @/tmp/test.jpg)
          if [ "$CODE" = "200" ]; then
            echo "::notice title=✅ Photo upload works::owner uploaded a test photo"
            curl -s -o /dev/null -X DELETE "$URL/storage/v1/object/product-images/$OBJ" -H "Authorization: Bearer $TOKEN" -H "apikey: $ANON"
          else
            echo "::error title=Photo upload HTTP $CODE::$(head -c 300 /tmp/up.json)"
          fi
          QUIET=1 .github/scripts/sql.sh "delete from auth.users where email = '$EMAIL'"
          echo "temporary user removed"
