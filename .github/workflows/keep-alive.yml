# Free Supabase projects pause after ~7 days without activity.
# This makes one tiny read every 3 days so the shop never "goes to sleep".
name: keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the shop table
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -z "$RAW_URL" ] && { echo "Supabase not set up yet — nothing to keep alive."; exit 0; }
          URL=$(echo "$RAW_URL" | tr -d '[:space:]"' | sed -E 's#(\.supabase\.co).*#\1#')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/shops?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::warning::Supabase did not answer 200 — check the project is not paused (supabase.com/dashboard)."; }
