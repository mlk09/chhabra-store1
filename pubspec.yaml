name: chhabra_store
description: "Chhabra General Store — kirana shop app for customers and the shopkeeper."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/new_order.wav
  fonts:
    - family: Mukta # English + Hindi (Devanagari) in one font, OFL licence
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700

# dart run flutter_launcher_icons   (after: python3 tools/make_icon.py)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon_square.png
  adaptive_icon_background: "#14874A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/icon/app_icon_square.png
    background_color: "#0C110F"
    theme_color: "#1FA45A"
